<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CFSv2 Verification Viewer</title><link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"><link rel="stylesheet" href="styles.css"></head><body><header><h1>NOAA CFSv2 Monthly Verification</h1><div class="toolbar"><label>Initialization <select id="init"></select></label><label>Forecast Month <select id="lead"></select></label><fieldset id="vars"></fieldset><label>Projection <select id="projection"><option>North America</option><option>Northern Hemisphere</option><option>Global</option></select></label><label>Colors <select id="palette"><option>NOAA</option><option>Tropical Tidbits</option><option>Colorblind</option></select></label><button id="png">Download PNG</button><button id="csv">Download CSV</button><button id="play">▶ Lead Animation</button><button id="dark">Dark mode</button></div></header><main><section class="maps"><article><h2>Forecast</h2><div id="forecast" class="map"></div></article><article><h2>Observed</h2><div id="observed" class="map"></div></article><article><h2>Forecast − Observation</h2><div id="difference" class="map"></div></article></section><section class="tools"><label>Observation opacity <input id="opacity" type="range" min="0" max="1" step="0.05" value="0.85"></label><div id="readout">Lat/Lon and values appear here.</div><div id="stats"></div><div id="chart"></div></section></main><script src="https://unpkg.com/leaflet/dist/leaflet.js"></script><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><script src="colormaps.js"></script><script src="static-data.js"></script><script src="verification.js"></script><script src="charts.js"></script><script src="map.js"></script><script src="app.js"></script></body></html>
